name: Build EPG Data

on:
  schedule:
    - cron: "0 0 * * *"   # Runs once a day at midnight UTC
  workflow_dispatch: {}    # Allows manual triggering

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download XML.GZ files
        continue-on-error: true
        run: |
          curl -L -o guide-us.xml.gz "https://github.com/epgshare01/share01/raw/master/epg_ripper_US1.xml.gz" || true
          curl -L -o guide-uk.xml.gz "https://github.com/epgshare01/share01/raw/master/epg_ripper_UK1.xml.gz" || true
          curl -L -o guide-in.xml.gz "https://github.com/epgshare01/share01/raw/master/epg_ripper_IN1.xml.gz" || true
          curl -L -o guide-de.xml.gz "https://github.com/epgshare01/share01/raw/master/epg_ripper_DE1.xml.gz" || true
          curl -L -o guide-ca.xml.gz "https://github.com/epgshare01/share01/raw/master/epg_ripper_CA1.xml.gz" || true

      - name: Process EPG Data
        run: node build-epg.mjs

      - name: Cleanup Large Files
        run: rm -f guide-*.xml.gz

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/
          git diff --staged --quiet || git commit -m "Update EPG data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
          
