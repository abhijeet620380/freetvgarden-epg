name: Build EPG Data

on:
  schedule:
    - cron: "17 * * * *"     # Runs every hour at minute 17 (avoids the busy top-of-hour queue)
  workflow_dispatch: {}      # Allows manual triggering

permissions:
  contents: write

concurrency:
  group: build-epg
  cancel-in-progress: false  # never run two builds at once

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Master XML.GZ file
        continue-on-error: true
        run: |
          # --fail: an HTTP error must not leave an HTML error page saved as the .gz file
          curl -L --fail --retry 3 --retry-delay 10 -D headers.txt -o guide-all.xml.gz "https://epgshare01.online/epgshare01/epg_ripper_ALL_SOURCES1.xml.gz" || rm -f guide-all.xml.gz
          # When the source file was last updated (shown in the site's "updated ... ago" note)
          LM=$(grep -i '^last-modified:' headers.txt | tail -1 | cut -d' ' -f2- | tr -d '\r')
          echo "Source Last-Modified: ${LM:-unknown}"
          echo "SOURCE_MODIFIED=$LM" >> "$GITHUB_ENV"

      - name: Process EPG Data
        run: node build-epg.mjs

      - name: Cleanup Large Files
        run: rm -f guide-all.xml.gz headers.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epg/ || true
          git diff --staged --quiet || git commit -m "Update EPG data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase || true
          git push || true
